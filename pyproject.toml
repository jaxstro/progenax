[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "progenax"
version = "0.1.0"
description = "Differentiable initial conditions for N-body simulations"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Anna Rosen", email = "alrosen@sdsu.edu" }]
keywords = ["astronomy", "n-body", "initial-conditions", "jax", "star-clusters", "differentiable"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Astronomy",
]
dependencies = [
    "jax>=0.4.20",
    "jaxlib>=0.4.20",
    "equinox>=0.11.0",
    "jaxtyping>=0.2.25",
    "diffrax>=0.4.0",
    "jaxstro",
]

[project.urls]
Repository = "https://github.com/jaxstro/progenax"

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-cov", "pytest-xdist>=3.0", "ruff>=0.6", "mypy>=1.8", "pyyaml>=6.0"]
# Exact (non-differentiable) CW04 Q / Lambda_MSR diagnostics path. progenax core
# is JAX-native; numpy+scipy are needed ONLY by progenax.diagnostics' scipy-backed
# estimators (compute_q_parameter, compute_lambda_msr), which import them lazily
# and raise an actionable error if this extra is missing (audit R9).
diagnostics = ["numpy>=1.24", "scipy>=1.11"]
# Plotting backend for the standalone scripts/validate_*.py figure scripts and the
# OED demo CLIs (they `pytest.importorskip("matplotlib")`, so released-core `[dev]`
# stays plot-free; install `[viz]` to run the validation figures / demo plots).
# progenax uses matplotlib only — no seaborn (cf. startrax's viz extra). There is no
# `[data]` extra: progenax's data artifacts are stdlib json + numpy .npz (numpy
# already arrives via jax / `[diagnostics]`), so no polars/pyarrow/pandas/h5py is used.
viz = ["matplotlib>=3.7", "seaborn>=0.13"]
# Repo-only experimental subsystem (src/experimental/gravoturb; NOT in the wheel).
# Differentiable-inference deps. blackjax 1.x `window_adaptation`/`nuts` API per
# inference/hmc.py (verified against 1.5); arviz for HMC convergence diagnostics
# (R-hat/ESS/divergences/BFMI, inference/diagnostics.py); scipy for the SBC rank-histogram
# chi^2 uniformity test (validation oracle side). All CPU-only, validation side.
#
# NOTE (audit R1/D2): jaxstroviz is deliberately NOT declared here. It is a PRIVATE,
# unpublished sibling, and pinning its editable path in the lock made `uv lock --check`
# / `uv sync --locked` fail in CI (and would break any non-sibling install) because the
# lock graph then requires a repo the default GITHUB_TOKEN cannot check out. The only
# code that needs it is the experimental SBC figure gallery + integer-aware chi^2 helpers
# (AC18), which already `pytest.importorskip("jaxstroviz")` and are xfail. To use the
# figure gallery locally, install it editable from the sibling checkout:
#     uv pip install -e ../jaxstroviz
# A nightly/release lane may check it out with a PAT and install it the same way.
#
# NOTE (ZAMS migration, 2026-06-14): the B4 binary-mass-function demo no longer needs
# the private `fluxax` sibling. The Tout+1996 ZAMS mass-luminosity relations
# (zams_luminosity / inverse_zams_luminosity) are now in-package as `progenax.stellar`
# (a startrax placeholder), so B4 runs in a clean environment / CI. `fluxax` remains the
# ecosystem's photometry package (SED / bandpass / flux); progenax only carries the
# zero-age stellar-structure relations, not photometry.
experimental = [
    "blackjax>=1.2,<2",
    "optax>=0.2",
    "arviz>=0.18",
    "scipy>=1.11",
    "flowjax>=17",  # conditional normalizing flow for the SBI/NPE low-N beta likelihood (Path C)
    # "numpyro>=0.13",  # reserved for the hierarchical population model (Decision #7)
]

# jaxstro is the only sibling ecosystem package in the lock graph. It is PUBLIC
# (github.com/jaxstro/jaxstro), so CI checks it out as an adjacent directory and
# `uv lock` / `uv sync --locked` resolve with no private-repo credentials.
# (jaxstroviz is intentionally absent — see the [experimental] note above.)
[tool.uv.sources]
jaxstro = { path = "../jaxstro", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["src/progenax"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
# src/experimental is dev/repo-only (NOT in the wheel: see hatch packages above).
# Adding it to pythonpath makes `import gravoturb` work during tests in both envs.
pythonpath = ["src", "src/experimental"]
markers = [
    "unit: fast isolated unit tests",
    "integration: cross-module integration tests",
    "validation: scientific validation tests (physics/statistics)",
    "slow: expensive tests excluded from the fast CI gate",
    "experimental: experimental gravoturb subsystem (follow-up paper, not released)",
]

[tool.coverage.run]
source = ["progenax"]
branch = true
omit = ["*/experimental/*", "*/__pycache__/*"]

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]

[tool.ruff]
target-version = "py311"
line-length = 88
src = ["src", "tests"]
fix = true

[tool.ruff.lint]
select = ["E", "F", "I"]  # pyflakes, pycodestyle errors, isort (matches jaxstro/fluxax)
ignore = [
    "E203",  # whitespace before ':' (formatter compat)
    "E501",  # line length — rely on the formatter / judgment
    "E741",  # ambiguous variable name (l is standard for galactic longitude)
    "F722",  # forward-annotation syntax error (jaxtyping uses "N 3" shape strings)
    "F821",  # undefined name (jaxtyping pattern vars like N, Array)
]

[tool.ruff.lint.per-file-ignores]
# Demo/test/validation code uses idiomatic compact style that is fine OUTSIDE the shipped
# library: sys.path-insert-then-import (E402), compact one-liners (E702), and lambda
# assignments (E731). These dirs stay LINTED for real bugs (F401/F811/F841/F541); only the
# stylistic codes are carved. The shipped package src/progenax is linted strictly.
"tests/**" = ["E402", "E702", "E731"]
"scripts/**" = ["E402", "E702", "E731"]
# progenax enables float64 via enable_high_precision() BEFORE importing its submodules
# (high precision must be configured before any JAX array is created); the package-init
# imports therefore legitimately follow that call, so E402 is carved here only.
"src/progenax/__init__.py" = ["E402"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
files = ["src/progenax"]
ignore_missing_imports = true
