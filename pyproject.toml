[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "progenax"
version = "0.1.0"
description = "Differentiable initial conditions for N-body simulations"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "jax>=0.4.20",
    "jaxlib>=0.4.20",
    "equinox>=0.11.0",
    "jaxtyping>=0.2.25",
    "diffrax>=0.4.0",
    "jaxstro",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-cov"]

[tool.hatch.build.targets.wheel]
packages = ["src/progenax"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
markers = [
    "unit: fast isolated unit tests",
    "integration: cross-module integration tests",
    "validation: scientific validation tests (physics/statistics)",
    "slow: expensive tests excluded from the fast CI gate",
]

[tool.coverage.run]
source = ["progenax"]
branch = true

[tool.coverage.report]
show_missing = true
