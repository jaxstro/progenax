[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "progenax"
version = "0.1.0"
description = "Differentiable initial conditions for N-body simulations"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "jax>=0.4.20",
    "jaxlib>=0.4.20",
    "equinox>=0.11.0",
    "jaxtyping>=0.2.25",
    "diffrax>=0.4.0",
    "jaxstro",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-cov"]
# Repo-only experimental subsystem (src/experimental/gravoturb_fdf; NOT in the wheel).
# Differentiable-inference deps. blackjax 1.x `window_adaptation`/`nuts` API per
# inference/hmc.py (verified against 1.5); arviz for HMC convergence diagnostics
# (R-hat/ESS/divergences/BFMI, inference/diagnostics.py); scipy for the SBC rank-histogram
# chi^2 uniformity test (validation oracle side); jaxstroviz for the reusable validation
# figure gallery + the integer-aware SBC chi^2 helpers (AC18). All CPU-only, validation side.
experimental = [
    "blackjax>=1.2,<2",
    "optax>=0.2",
    "arviz>=0.18",
    "scipy>=1.11",
    "jaxstroviz",
    "flowjax>=17",  # conditional normalizing flow for the SBI/NPE low-N beta likelihood (Path C)
    # "numpyro>=0.13",  # reserved for the hierarchical population model (Decision #7)
]

# jaxstro and jaxstroviz are sibling ecosystem packages (not published to PyPI). Resolve
# them from the standard side-by-side checkout so `uv lock` / `uv sync --locked` work.
# CI checks the siblings out as adjacent directories (see .github/workflows/tests.yml).
# jaxstroviz is the shared viz/validation package: progenax's validation scripts + figures
# live here and call it (like jaxstro for core utilities); it stays validation-side only
# (released progenax core never imports it; the experimental figure orchestrator import-guards).
[tool.uv.sources]
jaxstro = { path = "../jaxstro", editable = true }
jaxstroviz = { path = "../jaxstroviz", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["src/progenax"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
# src/experimental is dev/repo-only (NOT in the wheel: see hatch packages above).
# Adding it to pythonpath makes `import gravoturb_fdf` work during tests in both envs.
pythonpath = ["src", "src/experimental"]
markers = [
    "unit: fast isolated unit tests",
    "integration: cross-module integration tests",
    "validation: scientific validation tests (physics/statistics)",
    "slow: expensive tests excluded from the fast CI gate",
    "experimental: experimental gravoturb_fdf subsystem (follow-up paper, not released)",
]

[tool.coverage.run]
source = ["progenax"]
branch = true

[tool.coverage.report]
show_missing = true
