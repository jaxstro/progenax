[[equation]]
id = "EQ-MARKS-TABLE3-MCL"
name = "Table-3 mcl high-mass slope"
representation = "symbolic"
emits = ["latex", "oracle"]
equation_ref = "PDF p.6, printed p.2251, Eq.11 and Table3"
source_ids = ["marks2012topheavy"]
symbol_ids = ["SYM-lambda_env"]
expression = "Piecewise((-94/100*lambda_env+214/100,lambda_env>68/100),(23/10,True))"
returns = "imf_exponent"
note = "Notation conversion of the published decimal coefficients and strict > branch. Equality is canonical 2.3, matching the retained helper. lambda is log10(M_cl/(1e6 Msun)). No output clip or opt-in smoothing is included in this source expression; production clips to [0.5,2.3]. Empirical calibration is not established by symbolic agreement."

