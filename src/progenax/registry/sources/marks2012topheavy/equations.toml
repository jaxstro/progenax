[[equation]]
id = "EQ-MARKS-LOWMASS"
name = "Metallicity-dependent low-mass exponent"
representation = "symbolic"
emits = ["latex", "oracle"]
equation_ref = "PDF p.7, printed p.2252, Eq.12"
source_ids = ["marks2012topheavy"]
symbol_ids = ["SYM-alpha_c_env", "SYM-z_env"]
expression = "alpha_c_env+z_env/2"
returns = "imf_exponent"
note = "Transcription with the adopted central estimate Delta alpha=0.5 (paper says approximately 0.5); alpha_c is 1.3 or 2.3. Paper calls extrapolation below [Fe/H]=-0.5 uncertain. Input clips and low-mass floors belong to production, not this source relation."

[[equation]]
id = "EQ-MARKS-ROTATION"
name = "Fundamental-Plane rotation"
representation = "symbolic"
emits = ["latex", "oracle"]
equation_ref = "PDF p.7, printed p.2252, Eq.13"
source_ids = ["marks2012topheavy"]
symbol_ids = ["SYM-cos_env", "SYM-sin_env", "SYM-z_env", "SYM-R_env"]
expression = "cos_env*z_env+sin_env*R_env"
returns = "rotated_coordinate"
note = "Notation conversion of Eq.13: cos_env=cos(98 degrees), sin_env=sin(98 degrees). Trigonometric values are caller-bound source quantities, not independent empirical fit parameters. Production instead uses the rounded pair (-0.139,0.990)."

[[equation]]
id = "EQ-MARKS-EQ15"
name = "Printed expanded Fundamental-Plane branch"
representation = "symbolic"
emits = ["latex", "oracle"]
equation_ref = "PDF p.7, printed p.2252, Eq.15"
source_ids = ["marks2012topheavy"]
symbol_ids = ["SYM-z_env", "SYM-R_env"]
expression = "572/10000*z_env-4072/10000*R_env+19383/10000"
returns = "imf_exponent"
note = "Literal published branch; apply only above the corrected threshold specified in the 2014 erratum. This is not algebraically identical to production using rounded unnormalized Eq.13 rotation. Fig.6 text names x-prime/sin(98 degrees); the normalized coordinate yields density coefficient -0.4072 and metallicity coefficient 0.057228..., close to this printed expression."
