name: physics-validation

# Nightly + release-tag lane for the headline trust anchors that the PR gate skips:
# the @pytest.mark.slow validations (LIMEPY reference parity, multimass equilibrium,
# Engine A-vs-B anchor, Engine B AD-vs-FD). PROGENAX_STRICT_REFS=1 makes a missing
# reference cache a hard failure here (audit R8/T4), so these gates cannot silently
# no-op. Only the PUBLIC jaxstro sibling is needed (the lock is decoupled from the
# private jaxstroviz/fluxax — audit R1/D2); jaxstroviz-dependent experimental SBC
# tests import-skip.

on:
  schedule:
    - cron: "17 9 * * *"   # nightly
  workflow_dispatch:
  push:
    tags: ["v*"]

env:
  JAX_ENABLE_X64: "1"
  XLA_PYTHON_CLIENT_PREALLOCATE: "false"
  XLA_PYTHON_CLIENT_ALLOCATOR: platform
  OMP_NUM_THREADS: "1"
  PROGENAX_STRICT_REFS: "1"

jobs:
  slow-physics:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout progenax
        uses: actions/checkout@v4
        with:
          path: progenax
      - name: Checkout jaxstro (public path dependency, sibling layout)
        uses: actions/checkout@v4
        with:
          repository: jaxstro/jaxstro
          path: jaxstro
      - name: Setup uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - name: Sync from lockfile (dev + experimental)
        working-directory: progenax
        run: uv sync --locked --extra dev --extra experimental
      - name: Strict reference guard (cache must be present)
        working-directory: progenax
        run: uv run --no-sync pytest tests/validation/test_strict_refs.py -q
      - name: Slow physics-validation suite (the advertised trust anchors)
        working-directory: progenax
        run: uv run --no-sync pytest tests -m slow -q

  # Version matrix (audit T3): requires-python is >=3.10 but only 3.13 is exercised
  # on the PR lane. Nightly, run a representative memory-safe core slice (imf +
  # profiles — the IMF maths + the diffrax ODE profiles, the most version-sensitive
  # numerics) on the floor and ceiling Python. Not the PR lane (keeps PR latency flat).
  version-matrix:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout progenax
        uses: actions/checkout@v4
        with:
          path: progenax
      - name: Checkout jaxstro (public path dependency, sibling layout)
        uses: actions/checkout@v4
        with:
          repository: jaxstro/jaxstro
          path: jaxstro
      - name: Setup uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Sync (dev) on Python ${{ matrix.python-version }}
        working-directory: progenax
        run: uv sync --extra dev --python ${{ matrix.python-version }}
      - name: Core version-compat slice (imf + profiles)
        working-directory: progenax
        run: uv run --no-sync pytest tests/unit/imf tests/unit/profiles -m "not slow" -q
