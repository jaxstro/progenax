name: tests

on:
  pull_request:
  workflow_dispatch:

# Runs on PRs + manual dispatch only (NOT every push to main): a green PR already
# certifies the merge commit, so re-running ~9 runner-jobs on every main push just
# burns Actions minutes. Re-add `push: branches: [main]` if you want post-merge runs.
concurrency:
  # Cancel superseded in-progress runs on the same ref (e.g. rapid PR pushes) so we
  # never pay for a stale run that a newer commit has already obsoleted.
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Global env for every job. JAX float64 + low-memory settings: the ~815-test released-core
# suite was OOM-cancelled when run as ONE process on the 2-core / 7 GB ubuntu-latest runner.
# PREALLOCATE=false and the platform allocator release device memory between allocations;
# OMP_NUM_THREADS=1 caps BLAS threads on the 2-core runner.
env:
  JAX_ENABLE_X64: "1"
  XLA_PYTHON_CLIENT_PREALLOCATE: "false"
  XLA_PYTHON_CLIENT_ALLOCATOR: platform
  OMP_NUM_THREADS: "1"

jobs:
  # Cheap, fast guard: fail in seconds if uv.lock drifts from pyproject.toml, instead of
  # failing minutes into a `uv sync --locked`.
  lock-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout progenax
        uses: actions/checkout@v4
        with:
          path: progenax
      - name: Checkout jaxstro (path dependency, sibling layout)
        uses: actions/checkout@v4
        with:
          repository: jaxstro/jaxstro
          path: jaxstro
      - name: Setup uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - name: uv.lock matches pyproject.toml
        working-directory: progenax
        run: uv lock --check

  # Released-core invariant, SHARDED. Each shard runs in a FRESH process on its own
  # runner -> bounded memory, parallel wall-clock, isolates which shard fails.
  # The ~900-test unit tier is split into 3 sub-shards (~300 each): one process
  # accumulating all of it OOM-killed the 2-core/7 GB runner (exit 143, audit R1
  # follow-up). unit-c is a CATCH-ALL (tests/unit minus the two heavy groups), so
  # a NEW tests/unit subdir is still run without editing this matrix.
  # fail-fast: false so all shards report.
  released-core:
    strategy:
      fail-fast: false
      matrix:
        include:
          # imf and profiles are the two heaviest modules (profiles compiles the
          # diffrax-ODE King/Michie/LIMEPY + Eddington families) -> each gets its
          # own shard. unit-c is the catch-all (everything else) so a new subdir is
          # still covered. The conftest CI cache-clear bounds per-module memory.
          - { name: unit-a, paths: "tests/unit/imf" }
          - { name: unit-b, paths: "tests/unit/profiles" }
          - { name: unit-c, paths: "tests/unit --ignore=tests/unit/imf --ignore=tests/unit/profiles" }
          - { name: integration, paths: "tests/integration" }
          - { name: validation, paths: "tests/validation" }
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout progenax
        uses: actions/checkout@v4
        with:
          path: progenax
      - name: Checkout jaxstro (path dependency, sibling layout)
        uses: actions/checkout@v4
        with:
          repository: jaxstro/jaxstro
          path: jaxstro
      - name: Setup uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - name: Sync from lockfile (dev extra)
        working-directory: progenax
        run: uv sync --locked --extra dev
      - name: Run ${{ matrix.name }}
        working-directory: progenax
        run: uv run --no-sync pytest ${{ matrix.paths }} -m "not slow" -q

  # Experimental gravoturb subsystem (repo-only, NOT in the wheel). Needs the
  # [experimental] extra (blackjax, optax); runs the non-slow experimental suite.
  experimental:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout progenax
        uses: actions/checkout@v4
        with:
          path: progenax
      - name: Checkout jaxstro (path dependency, sibling layout)
        uses: actions/checkout@v4
        with:
          repository: jaxstro/jaxstro
          path: jaxstro
      - name: Setup uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - name: Sync from lockfile (dev + experimental extras)
        working-directory: progenax
        run: uv sync --locked --extra dev --extra experimental
      - name: Run experimental suite
        working-directory: progenax
        run: uv run --no-sync pytest tests/experimental -m "not slow" -q

  # Wheel-smoke (audit M6): build the wheel, install it in a CLEAN venv with only
  # the public jaxstro sibling, and import the package + the diagnostics subpackage.
  # Catches packaging regressions an editable dev install hides — missing runtime
  # deps, experimental/gravoturb leakage, and the R9 eager numpy/scipy import (the
  # clean venv has no scipy, so progenax.diagnostics must import lazily).
  wheel-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout progenax
        uses: actions/checkout@v4
        with:
          path: progenax
      - name: Checkout jaxstro (path dependency, sibling layout)
        uses: actions/checkout@v4
        with:
          repository: jaxstro/jaxstro
          path: jaxstro
      - name: Setup uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - name: Build wheel
        working-directory: progenax
        run: uv build --wheel -o dist/
      - name: Install wheel in a clean venv and import
        working-directory: progenax
        run: |
          uv venv /tmp/clean
          uv pip install --python /tmp/clean/bin/python dist/*.whl ../jaxstro
          /tmp/clean/bin/python -c "import progenax; import progenax.diagnostics; print(progenax.__name__, 'imports clean (no scipy in venv)')"

  # Gradient-integrity gate (design D2): the grad-audit run-gate + the Layer-2 staleness
  # comparator + the Layer-3 coverage ratchet / __all__ cross-check, PLUS the audit-script
  # exit-0 (0 hazards). A reintroduced silent-zero, a registry<->JSON drift, or a new/removed
  # entry point without a case reds this job. Fast (the grad-audit subset only — NOT the whole
  # validation shard), runtime-isolated, and a clearly-named branch-protection signal. The
  # staleness comparator regenerates the JSON on x86 and tolerance-compares to the committed
  # arm64 artifact (test_json_fresh._RTOL); this job's first run is the cross-arch rtol basis.
  gradient-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout progenax
        uses: actions/checkout@v4
        with:
          path: progenax
      - name: Checkout jaxstro (path dependency, sibling layout)
        uses: actions/checkout@v4
        with:
          repository: jaxstro/jaxstro
          path: jaxstro
      - name: Setup uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - name: Sync from lockfile (dev extra)
        working-directory: progenax
        run: uv sync --locked --extra dev
      - name: Run gate + staleness + coverage ratchet
        working-directory: progenax
        run: uv run --no-sync pytest tests/validation/grad_audit tests/validation/test_grad_audit.py -q
      - name: Audit script exits 0 (0 hazards)
        working-directory: progenax
        run: uv run --no-sync python scripts/audit_gradients.py

  # Aggregator gate: a single `tests` check that is green iff every required job above
  # succeeded — preserves the `tests` branch-protection check name. `if: always()` so a
  # failed/cancelled dependency reds it (a skipped dependent job would otherwise let
  # failures slip through branch protection).
  tests:
    if: always()
    needs: [lock-check, released-core, experimental, wheel-smoke, gradient-gate]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: All required jobs succeeded
        run: |
          echo "lock-check=${{ needs.lock-check.result }}  released-core=${{ needs.released-core.result }}  experimental=${{ needs.experimental.result }}  wheel-smoke=${{ needs.wheel-smoke.result }}  gradient-gate=${{ needs.gradient-gate.result }}"
          if [ "${{ needs.lock-check.result }}" = "success" ] \
             && [ "${{ needs.released-core.result }}" = "success" ] \
             && [ "${{ needs.experimental.result }}" = "success" ] \
             && [ "${{ needs.wheel-smoke.result }}" = "success" ] \
             && [ "${{ needs.gradient-gate.result }}" = "success" ]; then
            echo "all required jobs green"
          else
            echo "::error::a required job did not succeed"
            exit 1
          fi
