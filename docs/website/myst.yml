# progenax documentation site
# Build: `cd docs/website && myst build`
# Serve: `cd docs/website && myst start`
# See: https://mystmd.org/guide

version: 1
project:
  id: progenax-docs
  title: progenax — differentiable initial conditions for N-body simulations
  description: >-
    progenax is a JAX-native package in the jaxstro ecosystem providing
    differentiable initial conditions, mass functions, and binary populations
    for N-body simulations (with experimental gravoturbulent substructure in
    the repo-only gravoturb_fdf package). This site is the single source of
    truth for its theory, architecture, and API.
  authors:
    - name: Anna L. Rosen
      affiliation: San Diego State University
      orcid: 0000-0003-4423-0660
      email: alrosen@sdsu.edu
  github: https://github.com/drannarosen/progenax
  license:
    code: Apache-2.0
    content: CC-BY-4.0
  open_access: true
  subject: Astrophysics
  keywords:
    - JAX
    - differentiable programming
    - N-body simulations
    - star clusters
    - initial mass function
    - gravoturbulence
    - stellar dynamics
  bibliography:
    - references.bib

  # Math defaults
  math:
    '\Msun': '\mathrm{M}_\odot'
    '\Rsun': '\mathrm{R}_\odot'
    '\Lsun': '\mathrm{L}_\odot'
    '\rh': 'r_{\mathrm{h}}'
    '\rt': 'r_{\mathrm{t}}'
    '\tff': 't_{\mathrm{ff}}'

