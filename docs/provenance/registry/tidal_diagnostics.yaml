# Provenance model cards — tidal physics & diagnostics (ADR-0034).
# Generated glossary: docs/website/15-model-reference/tidal_diagnostics.md.
# Equations transcribed VERBATIM from the theory pages; CW04 Table-1 anchors,
# the Jacobi cube-root law, and Allison 2009 are ledger-verified (Batch 3-4).
# Phase B5: jacobi_tidal, cw04_q, mass_segregation (all extra-registry
# diagnostics/modifiers — no MODEL_INVARIANTS rows).

- model: jacobi_tidal
  family_display: Jacobi radius & tidal truncation
  description: >
    The tidal (Jacobi) radius of a cluster on a circular galactic orbit —
    the generalized cube-root law covering the point-mass (Keplerian) and
    flat-rotation-curve (isothermal) hosts — and the post-sampling
    truncation operator that removes stars beyond it.
  when_to_use:
    good_for:
      - "setting a physically motivated outer edge from the host potential"
      - "fill-factor studies (r_h/r_J as the tidal-filling knob)"
    not_for:
      - "eccentric orbits (the circular-orbit r_J over-estimates the effective edge at perigalacticon)"
      - "self-consistent tidally truncated DFs (that is what King/LIMEPY are for)"
  parameters:
    - name: M_cl
      meaning: "cluster mass"
      units: Msun
      typical_range: "1e2–1e6"
      code_arg: "jacobi_radius(M_cl=...)"
    - name: M_gal
      meaning: "host mass enclosed within the orbital radius"
      units: Msun
      typical_range: "1e10–1e12"
      code_arg: "jacobi_radius(M_gal=...)"
    - name: R
      meaning: "galactocentric orbital radius"
      units: pc (or kpc via units)
      typical_range: "1–30 kpc"
      code_arg: "jacobi_radius(R=...)"
  sources:
    - bibkey: King1962
      provides: "the tidal-radius concept and the (m/3M)^(1/3) cube-root law (DOI verified live)"
      locators: ["Section II (the empirical tidal cutoff)"]
    - bibkey: Baumgardt2003
      provides: "the isothermal-host form r_t = (G m / 2 V^2)^(1/3) R^(2/3) used for flat rotation curves"
      locators: ["Eq. 5"]
  equations:
    - label: jacobi-circular
      latex: 'r_J \;=\; R\,\biggl[\frac{M_{\mathrm{cl}}}{(3 - \mathrm{d}\ln M_{\mathrm{gal}}/\mathrm{d}\ln R)\,M_{\mathrm{gal}}(<R)}\biggr]^{1/3}'
      symbols:
        r_J: {latex: 'r_J', meaning: "Jacobi (tidal) radius; the L1 Lagrange distance", units: pc}
      assumptions: ["circular orbit", "point-mass host: denominator 3 (King 1962); isothermal host (dlnM/dlnR = 1): denominator 2 (Baumgardt & Makino 2003)"]
      theory_ref: "10-theory/tidal-and-substructure/tidal.md#jacobi-circular"
    - label: fill-factor
      latex: '\mathcal{F} \;\equiv\; \frac{r_h}{r_J}'
      symbols:
        F: {latex: '\mathcal{F}', meaning: "tidal fill factor (underfilling << 1; Roche-filling ~ 0.5)", units: dimensionless}
      assumptions: []
      theory_ref: "10-theory/tidal-and-substructure/tidal.md#fill-factor"
  code_refs:
    - "tidal.py::jacobi_radius"
    - "tidal.py::apply_tidal_truncation"
  validation:
    - "tests/validation/test_tidal_physics.py::TestJacobiTidalBalance::test_self_gravity_equals_tidal_plus_centrifugal"
    - "tests/validation/test_tidal_physics.py::TestJacobiL1Lagrange::test_matches_l1_for_realistic_cluster"
    - "tests/validation/test_tidal_physics.py::TestKeplerianVsIsothermal::test_isothermal_keplerian_ratio"
  status: verified
  deviations: []

- model: cw04_q
  family_display: Cartwright & Whitworth (2004) Q diagnostic
  description: >
    The MST-based substructure statistic Q = mbar / sbar (normalized mean
    MST edge length over normalized correlation length): Q < 0.8 flags
    substructure, Q > 0.8 central concentration. Exact estimator
    (compute_q_parameter) plus the differentiable kNN surrogate (q_approx,
    recalibrated in audit S3).
  when_to_use:
    good_for:
      - "quantifying substructure/smoothness of sampled or observed positions"
      - "differentiable pipelines: q_approx as a Fisher-able summary (grad-audited)"
    not_for:
      - "distinguishing substructure TYPES (fractal vs radial gradients can share a Q)"
      - "small N (CW04 calibrated at 100 <= N <= 300; anchors carry realization scatter)"
  parameters:
    - name: positions
      meaning: "2-D projected positions (the CW04 convention; A = pi R^2 normalization)"
      units: pc
      typical_range: "N >= ~100"
      code_arg: "compute_q_parameter(positions_2d) / q_approx(positions)"
  sources:
    - bibkey: Cartwright2004
      provides: "the Q = mbar/sbar statistic, the A = pi R^2 normalization convention, and the Table-1 fractal/radial anchors (ledger-verified p. 590)"
      locators: ["Section 4 (definition)", "Table 1, p. 590 (Q = 0.45/0.61/0.73/0.80 at D = 1.5/2.0/2.5/3.0)"]
  equations:
    - label: cw04-q-def
      latex: 'Q \;\equiv\; \frac{\bar m}{\bar s}, \qquad \bar m = \frac{\langle \ell_{\rm MST} \rangle}{\sqrt{A/N}}, \quad \bar s = \frac{\langle r_{ij} \rangle}{R}, \quad A = \pi R^2'
      symbols:
        mbar: {latex: '\bar m', meaning: "mean MST edge length normalized by sqrt(A/N)", units: dimensionless}
        sbar: {latex: '\bar s', meaning: "mean pairwise separation normalized by the cluster radius R", units: dimensionless}
      assumptions: ["2-D projected positions", "A = pi R^2 (the CW04 area convention — NOT the convex hull)", "uniform-sphere anchor Q = 0.79 +/- 0.02 reproduced to < 0.01"]
      theory_ref: null
  code_refs:
    - "diagnostics/substructure.py::compute_q_parameter"
    - "diagnostics/q_approx.py::q_approx"
  validation:
    - "tests/unit/substructure/test_q_baselines.py::TestUniformSphereBaseline::test_q_matches_cw04_range"
    - "tests/unit/substructure/test_q_approx.py::TestQApproxCalibrationAccuracy::test_calibrated_q_approx_matches_exact"
  status: verified
  deviations:
    - "q_approx (the differentiable kNN surrogate) approximates the exact MST statistic; its DEFAULT_CALIBRATION was re-fit in audit S3 (stale 1.375696 -> 1.287344, removing a +7% bias vs compute_q_parameter)."

- model: mass_segregation
  family_display: Primordial mass segregation & Lambda_MSR
  description: >
    The energy-sorted primordial-segregation generator (most-massive stars
    on the most-bound orbits, no orbit reuse) and the Allison et al. (2009)
    Lambda_MSR MST diagnostic that measures it — plus the differentiable
    soft surrogate lambda_msr_approx.
  when_to_use:
    good_for:
      - "non-equilibrium primordial segregation ICs (energy-sorted assignment)"
      - "measuring segregation: Lambda_MSR > 1 = massive stars more concentrated"
      - "EQUILIBRIUM segregation belongs to Engine A's from_mass_segregation (see that card)"
    not_for:
      - "dynamical (evolved) segregation — this is the IC-time operator"
  parameters:
    - name: n_massive
      meaning: "size of the massive subset compared against random subsets in Lambda_MSR"
      units: count
      typical_range: "5–20"
      code_arg: "lambda_msr(..., n_massive=...)"
  sources:
    - bibkey: Allison2009
      provides: "the Lambda_MSR MST-ratio diagnostic"
      locators: ["Eq. 1 + Section 2 (per-paper material, ledger-verified)"]
    - bibkey: Baumgardt2008
      provides: "the primordial-segregation IC context (segregated initial models)"
      locators: ["Section 2"]
  equations:
    - label: orbit-energy
      latex: 'E_i \;=\; \tfrac{1}{2}|\mathbf{v}_i|^2 \;+\; \Phi(\mathbf{r}_i)'
      symbols:
        E_i: {latex: 'E_i', meaning: "specific orbital energy used for the energy-sorted assignment (most massive -> most bound)", units: "pc^2 / Myr^2"}
      assumptions: ["assignment permutes orbits, never reuses one (masses preserved exactly)"]
      theory_ref: "10-theory/tidal-and-substructure/mass-segregation.md#orbit-energy"
    - label: lambda-msr
      latex: '\Lambda_{\mathrm{MSR}} \;=\; \frac{\langle\, \ell_{\mathrm{random}}\,\rangle}{\ell_{\mathrm{massive}}} \;\pm\;\frac{\sigma_{\mathrm{random}}}{\ell_{\mathrm{massive}}}'
      symbols:
        l_massive: {latex: '\ell_{\mathrm{massive}}', meaning: "MST length of the n_massive most massive stars", units: pc}
        l_random: {latex: '\langle \ell_{\mathrm{random}} \rangle', meaning: "mean MST length of same-size random subsets", units: pc}
      assumptions: ["Lambda_MSR ~ 1: no segregation; > 1: massive stars more concentrated (Allison 2009)"]
      theory_ref: "10-theory/tidal-and-substructure/mass-segregation.md#lambda-msr"
  code_refs:
    - "cluster/mass_segregation.py::energy_sorted_segregation"
    - "diagnostics/segregation_approx.py::lambda_msr_approx"
  validation:
    - "tests/unit/cluster/test_mass_segregation.py::TestEnergySortedSegregation::test_assigned_energy_is_monotonic_in_mass"
    - "tests/unit/cluster/test_mass_segregation.py::TestEnergySortedSegregation::test_most_massive_star_is_the_most_bound"
  status: verified
  deviations: []
