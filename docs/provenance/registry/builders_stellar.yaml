# Provenance model cards — cluster builders + stellar relations (ADR-0034, B6).
# Generated glossary: docs/website/15-model-reference/builders_stellar.md.

- model: cluster_builders
  family_display: Cluster builders (build_cluster + named wrappers)
  description: >
    The one-call IC convenience layer: build_cluster and the six named
    wrappers (Plummer/King/EFF/Michie/LIMEPY + from_params) are pure sugar
    over build_spatial_ic — bit-identical outputs — pairing each profile
    with its matched equilibrium DF (matched_velocity_df kills the
    mismatched-r_h footgun). A semantics card: the physics lives in the
    composed model cards.
  when_to_use:
    good_for:
      - "the recommended one-call entry point for standard cluster ICs"
      - "Q=None (default) = faithful UNSCALED equilibrium from the matched DF"
    not_for:
      - "custom profile/DF cross-pairings (compose build_spatial_ic directly)"
      - "tidal_radius on non-Plummer profiles (they carry a native r_t; the kwarg is Plummer-only by design)"
  parameters:
    - name: profile
      meaning: "which model family to build (see that family's card for its physics)"
      units: "—"
      typical_range: "—"
      code_arg: "build_cluster(profile=...) / build_king_cluster(...) etc."
    - name: Q
      meaning: "optional virial rescale target; None = no rescale (the DF's own equilibrium)"
      units: dimensionless
      typical_range: "None (or 0.5 to force-rescale, e.g. after rotation overlays)"
      code_arg: "build_cluster(Q=...)"
  sources:
    - bibkey: Aarseth1974
      provides: "the Q = T/|V| convention the builders report"
      locators: ["Eq. 1 context"]
  equations:
    - label: builders-q-convention
      latex: 'Q \;\equiv\; \frac{T}{|V|}, \qquad Q = \tfrac12 \iff 2T + V = 0'
      symbols:
        Q: {latex: 'Q', meaning: "virial ratio (0.5 = equilibrium; < 0.5 subvirial/cold; > 0.5 supervirial)", units: dimensionless}
      assumptions: ["matched profile+DF pairs land at Q = 0.5 WITHOUT rescale (finite-N fluctuation only)"]
      theory_ref: null
  code_refs:
    - "builders_cluster.py::build_cluster"
    - "builders_cluster.py::build_plummer_cluster"
    - "builders_cluster.py::build_king_cluster"
    - "builders_cluster.py::build_eff_cluster"
    - "builders_cluster.py::build_michie_cluster"
    - "builders_cluster.py::build_limepy_cluster"
    - "builders_cluster.py::build_cluster_from_params"
    - "builders_cluster.py::matched_velocity_df"
  validation:
    - "tests/unit/builders/test_cluster_builders.py::test_build_cluster_is_bit_identical_to_manual_base_case"
    - "tests/unit/builders/test_cluster_builders.py::test_plummer_alias_identical"
    - "tests/unit/builders/test_cluster_builders.py::test_limepy_alias_identical"
    - "tests/unit/builders/test_cluster_builders.py::test_cluster_params_wrapper_identical_to_build_cluster"
  status: verified
  deviations: []

- model: zams_tout1996
  family_display: Tout+1996 ZAMS stellar relations
  description: >
    Zero-age-main-sequence L(M, Z) and R(M, Z) from the Tout et al. (1996)
    rational-polynomial fits (75/75 coefficients ledger-verified cell-by-cell
    against the PDF), with derived T_eff and log g. Internalized into
    progenax.stellar as the startrax placeholder.
  when_to_use:
    good_for:
      - "ZAMS photometric/structural labels for sampled masses (0.1-100 Msun, Z in [1e-4, 0.03])"
      - "differentiable M <-> L inversion (inverse_zams_luminosity, grad-audited)"
    not_for:
      - "evolved stars (ZAMS only; evolution is startrax's future scope)"
  parameters:
    - name: M
      meaning: "stellar mass"
      units: Msun
      typical_range: "0.1–100 (fit range)"
      code_arg: "zams_luminosity(M) / zams_radius(M) / ..."
    - name: Z
      meaning: "metallicity (solar 0.02)"
      units: dimensionless
      typical_range: "1e-4–0.03"
      code_arg: "zams_luminosity(M, Z=...)"
  sources:
    - bibkey: Tout1996
      provides: "the L(M,Z) and R(M,Z) rational-polynomial fits; 75/75 coefficients verified exactly (Tables 1-2)"
      locators: ["Eq. 3 + Table 1 (luminosity, 35 coefficients)", "Eq. 4 + Table 2 (radius, 40 coefficients; nu fixed at the Z = 0.02 optimum, p. 258)"]
  equations:
    - label: tout-solar-anchors
      latex: 'L(1\,M_\odot) = 0.6977\,L_\odot,\quad R(1\,M_\odot) = 0.8882\,R_\odot,\quad T_{\rm eff} \approx 5600\,{\rm K},\quad \log g \approx 4.54'
      symbols:
        L: {latex: 'L', meaning: "ZAMS luminosity (the ZAMS Sun is FAINTER than today's Sun — do not 'fix' to 1.0)", units: Lsun}
      assumptions: ["Z = 0.02; anchors computed from the verified coefficients and pinned by test_zams_physics"]
      theory_ref: null
  code_refs:
    - "stellar.py::zams_luminosity"
    - "stellar.py::zams_radius"
    - "stellar.py::zams_effective_temperature"
    - "stellar.py::inverse_zams_luminosity"
  validation:
    - "tests/validation/test_zams_physics.py::TestSolarAnchors::test_luminosity_solar_anchor"
    - "tests/validation/test_zams_physics.py::TestSolarAnchors::test_radius_solar_anchor"
    - "tests/validation/test_zams_physics.py::TestStefanBoltzmannClosure::test_teff_matches_stefan_boltzmann"
  status: verified
  deviations: []
